<script>
  function availabilityApp() {
    const ACTIVE_TEAM_TYPES = Array.isArray(window.APP_CTX?.activeTeamTypes)
      ? window.APP_CTX.activeTeamTypes
      : ['Worship'];
    const ACTIVE_TEAM_TYPE_SET = new Set(ACTIVE_TEAM_TYPES.map(team => String(team || '').trim().toLowerCase()).filter(Boolean));
    return {
      email: '',
      services: [],
      selectedServiceIds: [],
      loadingServices: true,
      loadingAvailability: false,
      saving: false,
      error: '',
      statusMessage: '',
      prefilledFor: '',
      memberVerified: false,
      verifiedEmail: '',
      shareLink: '',
      emailSubject: '',
      emailBody: '',
      emailEditorOpen: false,
      activeAdminTab: 'availability',
      isAdmin: false,
      viewerProfile: (typeof window !== 'undefined' && window.__AUTH__) || null,
      autoLoadedViewerEmail: '',
      managedEmail: '',
      recipientLoading: false,
      recipientError: '',
      recipientTeams: [{ value: 'all', label: 'All members' }],
      recipientMembers: [],
      filteredRecipients: [],
      selectedRecipientTeam: 'all',
      selectedRecipientEmails: [],
      emailSending: false,
      emailSendStatus: '',
      emailSendError: '',

      init() {
        this.prepareEmailTemplate();
        this.syncViewerProfile();
        document.addEventListener('app-auth-changed', (event) => {
          this.applyViewerProfile(event?.detail || null);
        });
        this.loadViewerProfile();
        this.fetchServices();
        setTimeout(() => this.syncViewerProfile(), 0);
        try {
          const params = new URLSearchParams(location.search || '');
          const emailParam = params.get('email');
          if (emailParam) {
            this.email = emailParam;
            this.prefillAvailability(true);
          }
        } catch (_) { /* ignore */ }
      },

      currentGlobalAuth() {
        return (typeof window !== 'undefined' && window.__AUTH__) || null;
      },

      syncViewerProfile() {
        this.applyViewerProfile(this.currentGlobalAuth());
      },

      applyViewerProfile(profile) {
        const previousViewerEmail = this.viewerEmail();
        const next = profile && typeof profile === 'object'
          ? profile
          : (this.currentGlobalAuth() && typeof this.currentGlobalAuth() === 'object' ? this.currentGlobalAuth() : null);
        this.viewerProfile = next;
        const canAdminAvailability = Boolean(next?.capabilities?.canAdminAvailability);
        const isAdmin = Boolean(next?.isAdmin || canAdminAvailability);
        const becameAdmin = isAdmin && !this.isAdmin;
        this.isAdmin = isAdmin;
        const nextViewerEmail = this.viewerEmail();
        if (nextViewerEmail) {
          if (!this.email || this.normalizedEmail(this.email) === previousViewerEmail) {
            this.email = nextViewerEmail;
          }
          if (!this.isManageTab()) {
            this.maybeAutoLoadSignedInUser();
          }
        }
        if (!isAdmin) {
          this.activeAdminTab = 'availability';
        }
        if (becameAdmin && !this.recipientLoading && !this.recipientMembers.length) {
          this.loadEmailRecipients();
        }
      },

      setAdminTab(tab) {
        this.activeAdminTab = tab === 'share' ? 'share' : (tab === 'manage' ? 'manage' : 'availability');
        this.error = '';
        this.statusMessage = '';
        if (this.isManageTab()) {
          this.resetLoadedAvailability();
          this.managedEmail = '';
        } else {
          this.resetLoadedAvailability();
          if (this.viewerEmail()) {
            this.email = this.viewerEmail();
            this.maybeAutoLoadSignedInUser(true);
          }
        }
      },

      async loadViewerProfile() {
        try {
          const profile = await callRpc('getViewerProfile', null);
          const fallbackProfile = this.currentGlobalAuth();
          const profileCanAdmin = Boolean(profile?.isAdmin || profile?.capabilities?.canAdminAvailability);
          const fallbackCanAdmin = Boolean(fallbackProfile?.isAdmin || fallbackProfile?.capabilities?.canAdminAvailability);
          const hasProfileIdentity = Boolean(profile?.email || profile?.isLoggedIn);
          const effectiveProfile = fallbackCanAdmin && !profileCanAdmin
            ? fallbackProfile
            : ((hasProfileIdentity || profileCanAdmin) ? Object.assign({}, fallbackProfile || {}, profile || {}) : fallbackProfile);
          this.applyViewerProfile(effectiveProfile);
          this.maybeAutoLoadSignedInUser();
        } catch (e) {
          console.error(e);
          this.applyViewerProfile(this.currentGlobalAuth());
          this.maybeAutoLoadSignedInUser();
        }
      },

      isManageTab() {
        return this.isAdmin && this.activeAdminTab === 'manage';
      },

      viewerEmail() {
        const email = this.viewerProfile?.email || this.currentGlobalAuth()?.email || '';
        return this.normalizedEmail(email);
      },

      viewerLoggedIn() {
        const globalAuth = this.currentGlobalAuth();
        return Boolean((this.viewerProfile?.isLoggedIn || globalAuth?.isLoggedIn) && this.viewerEmail());
      },

      currentTargetEmail() {
        return this.isManageTab()
          ? this.normalizedEmail(this.managedEmail)
          : this.normalizedEmail(this.email);
      },

      availabilityCardTitle() {
        return this.isManageTab() ? 'Manage Availability' : 'Your Availability';
      },

      availabilityCardIntro() {
        return this.isManageTab()
          ? "Load a team member's excluded dates and update the services they cannot serve."
          : 'Let us know which upcoming services you are unavailable to serve.';
      },

      availabilityFieldLabel() {
        if (this.isManageTab()) return 'Team member';
        if (this.viewerLoggedIn()) return 'Signed in as';
        return 'Email address';
      },

      availabilityHelperText() {
        if (this.isManageTab()) return 'Choose a user and load dates to manage availability.';
        if (this.viewerLoggedIn()) return 'Your saved dates load automatically when you are signed in.';
        return 'Enter your email and load your dates to manage your availability.';
      },

      resetLoadedAvailability() {
        this.selectedServiceIds = [];
        this.memberVerified = false;
        this.verifiedEmail = '';
        this.prefilledFor = '';
      },

      maybeAutoLoadSignedInUser(force = false) {
        const viewerEmail = this.viewerEmail();
        if (!viewerEmail || this.isManageTab()) return;
        this.email = viewerEmail;
        if (!force && this.autoLoadedViewerEmail === viewerEmail) return;
        this.autoLoadedViewerEmail = viewerEmail;
        this.prefillAvailability(true, 'personal');
      },

      adminMemberOptions() {
        return Array.isArray(this.recipientMembers) ? this.recipientMembers : [];
      },

      adminEmailSelectDisabled() {
        return !this.isAdmin || this.recipientLoading || !this.adminMemberOptions().length;
      },

      prepareEmailTemplate() {
        this.shareLink = this.availabilityShareUrl();
        this.emailSubject = this.normalizeEmailSubject(this.emailSubject);
        if (!this.emailBody) {
          this.emailBody = `Hi team,\n\nPlease record your upcoming availability here:\n${this.shareLink}\n\nThank you!`;
        }
      },

      isActiveTeamType(value) {
        return ACTIVE_TEAM_TYPE_SET.has(String(value || '').trim().toLowerCase());
      },

      availabilityShareUrl() {
        const fallbackBase = `${location.origin}${location.pathname}`;
        const base = this.preferredShareBase() || fallbackBase;
        try {
          const url = new URL(base);
          url.searchParams.set('mode', 'guest');
          url.searchParams.set('tab', 'availability');
          if (!url.hash || url.hash === '#') {
            url.hash = '#/availability';
          }
          return url.toString();
        } catch (_) {
          const join = base.includes('?') ? '&' : '?';
          return `${base}${join}mode=guest&tab=availability#/availability`;
        }
      },

      preferredShareBase() {
        try {
          const { origin, pathname } = window.location || {};
          const locationBase = origin && pathname ? `${origin}${pathname}` : '';
          const path = String(pathname || '');
          if (!window.__BASE__) {
            return locationBase;
          }
          if (/\/dev(\/|$)/.test(path) || /localhost/i.test(String(origin || ''))) {
            return locationBase;
          }
          return window.__BASE__ || locationBase;
        } catch (_) {
          return window.__BASE__ || '';
        }
      },

      async copyShareLink() {
        await this.copyToClipboard(this.shareLink || '', 'Share link copied.');
      },

      async copyEmailSubject() {
        this.emailSubject = this.normalizeEmailSubject(this.emailSubject);
        await this.copyToClipboard(this.emailSubject, 'Subject copied.');
      },

      async copyEmailBody() {
        await this.copyToClipboard(this.emailBody || '', 'Email text copied.');
      },

      async copyRecipientEmails() {
        await this.copyToClipboard(this.selectedRecipientEmails.join(', '), 'Recipient emails copied.');
      },

      async sendAvailabilityEmail() {
        if (!this.selectedRecipientEmails.length) {
          notify('Select at least one recipient.', 'error');
          return;
        }
        this.emailSubject = this.normalizeEmailSubject(this.emailSubject);
        const subject = this.emailSubject;
        const body = String(this.emailBody || '').trim();
        if (!body) {
          this.emailSendError = 'Email text is required.';
          return;
        }
        this.emailSending = true;
        this.emailSendStatus = '';
        this.emailSendError = '';
        try {
          const res = await callRpc('sendAvailabilityEmail', {
            subject,
            body,
            recipients: this.selectedRecipientEmails
          });
          const count = res?.sent ?? this.selectedRecipientEmails.length;
          this.emailSendStatus = `Email sent to ${count} recipient${count === 1 ? '' : 's'}.`;
          notify('Availability email sent.', 'success');
        } catch (e) {
          console.error(e);
          this.emailSendError = (e && e.message) ? e.message : 'Unable to send email.';
        } finally {
          this.emailSending = false;
        }
      },

      normalizeEmailSubject(value) {
        const trimmed = String(value || '').trim();
        const fallback = 'Please update your availability';
        const base = trimmed || fallback;
        return base.startsWith('📅') ? base : `📅 ${base}`;
      },

      async copyToClipboard(text, successMsg = 'Copied.') {
        if (!text) {
          notify('Nothing to copy.', 'error');
          return;
        }
        try {
          if (navigator?.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', 'true');
            textarea.style.position = 'absolute';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            textarea.remove();
          }
          notify(successMsg, 'success');
        } catch (err) {
          console.error(err);
          notify('Unable to copy to clipboard.', 'error');
        }
      },

      async loadEmailRecipients() {
        this.recipientLoading = true;
        this.recipientError = '';
        try {
          const res = await callRpc('listRoles', null);
          const items = Array.isArray(res?.items) ? res.items : [];
          const members = items
            .map(row => {
              const email = String(row?.email || '').trim().toLowerCase();
              if (!email) return null;
              const first = String(row?.first || '').trim();
              const last = String(row?.last || '').trim();
              const teams = Array.isArray(row?.teams)
                ? row.teams.filter(team => this.isActiveTeamType(team))
                : String(row?.teamRaw || '')
                    .split(/[,;|]/)
                    .map(v => v.trim())
                    .filter(team => this.isActiveTeamType(team));
              if (!teams.length) return null;
              return {
                email,
                name: [first, last].filter(Boolean).join(' '),
                label: ([first, last].filter(Boolean).join(' ') || email),
                teams
              };
            })
            .filter(Boolean)
            .sort((a, b) => {
              const nameA = a.label || a.email;
              const nameB = b.label || b.email;
              return nameA.localeCompare(nameB);
            });
          const teamSet = new Set();
          members.forEach(m => {
            if (!Array.isArray(m.teams) || !m.teams.length) return;
            m.teams.forEach(team => {
              if (team) teamSet.add(team);
            });
          });
          const teams = [{ value: 'all', label: 'All members' }];
          Array.from(teamSet)
            .sort((a, b) => a.localeCompare(b))
            .forEach(team => teams.push({ value: team, label: team }));
          this.recipientMembers = members;
          this.recipientTeams = teams;
          this.applyRecipientFilter(this.selectedRecipientTeam || 'all');
        } catch (e) {
          console.error(e);
          this.recipientError = (e && e.message) ? e.message : 'Unable to load team members.';
          this.filteredRecipients = [];
          this.selectedRecipientEmails = [];
        } finally {
          this.recipientLoading = false;
        }
      },

      applyRecipientFilter(teamValue) {
        const team = teamValue || 'all';
        this.selectedRecipientTeam = team;
        if (team === 'all') {
          this.filteredRecipients = this.recipientMembers.slice();
        } else {
          this.filteredRecipients = this.recipientMembers.filter(m => Array.isArray(m.teams) && m.teams.includes(team));
        }
        this.selectedRecipientEmails = this.filteredRecipients.map(m => m.email);
      },

      selectAllRecipients() {
        this.selectedRecipientEmails = this.filteredRecipients.map(m => m.email);
      },

      deselectAllRecipients() {
        this.selectedRecipientEmails = [];
      },

      onRecipientTeamChange(value) {
        this.applyRecipientFilter(value);
      },

      todayISO() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      },

      emailValid() {
        return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(this.currentTargetEmail());
      },

      normalizedEmail(value) {
        return String(typeof value === 'undefined' ? this.email : value || '').trim().toLowerCase();
      },

      onEmailInput() {
        if (this.currentTargetEmail() !== this.prefilledFor) {
          this.resetLoadedAvailability();
          this.statusMessage = '';
        }
        if (!this.emailValid()) {
          this.error = '';
        }
      },

      onManagedEmailChange() {
        this.onEmailInput();
        if (this.emailValid()) {
          this.prefillAvailability(true, 'manage');
        } else {
          this.error = '';
        }
      },

      async verifyMemberEmail(force = false) {
        const email = this.currentTargetEmail();
        if (!email) {
          this.memberVerified = false;
          this.verifiedEmail = '';
          return false;
        }
        if (!force && this.memberVerified && email === this.verifiedEmail) {
          return true;
        }
        try {
          const res = await callRpc('memberExistsInRoles', { email });
          this.memberVerified = Boolean(res?.exists);
          this.verifiedEmail = this.memberVerified ? email : '';
          if (!this.memberVerified) {
            this.error = 'Please contact Belinda to add your email to the database.';
          } else {
            this.error = '';
          }
          return this.memberVerified;
        } catch (e) {
          console.error(e);
          this.memberVerified = false;
          this.verifiedEmail = '';
          this.error = (e && e.message) ? e.message : 'Unable to verify your email.';
          return false;
        }
      },

      async fetchServices() {
        this.loadingServices = true;
        this.error = '';
        try {
          const res = await callRpc('listServices', {
            includePast: false,
            sort: 'asc',
            startDate: this.todayISO(),
            limit: 20
          });
          const items = Array.isArray(res?.items) ? res.items : [];
          this.services = items.map(it => ({
            ...it,
            label: this.formatServiceLabel(it),
            subtitle: [it.type || '', it.time || '10:00 AM'].filter(Boolean).join(' • ') || 'Service'
          }));
        } catch (e) {
          console.error(e);
          this.error = (e && e.message) ? e.message : 'Unable to load services.';
        } finally {
          this.loadingServices = false;
        }
      },

      formatServiceLabel(item) {
        const iso = String(item?.date || '').trim();
        if (!iso) return item?.id || 'Service';
        try {
          const [y, m, d] = iso.split('-').map(Number);
          const dt = new Date(y, m - 1, d);
          return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        } catch (_) {
          return iso;
        }
      },

      async prefillAvailability(force = false) {
        const email = this.currentTargetEmail();
        if (!email) {
          this.error = this.isManageTab()
            ? 'Choose a user to load saved dates.'
            : 'Enter your email to load saved dates.';
          return;
        }
        if (!force && email === this.prefilledFor && this.memberVerified) return;
        this.loadingAvailability = true;
        this.error = '';
        try {
          const verified = await this.verifyMemberEmail(force);
          if (!verified) {
            this.selectedServiceIds = [];
            this.statusMessage = '';
            this.prefilledFor = '';
            return;
          }
          const res = await callRpc('getMemberAvailability', { email });
          this.selectedServiceIds = Array.isArray(res?.unavailable) ? res.unavailable.slice() : [];
          this.prefilledFor = email;
          this.statusMessage = this.selectedServiceIds.length
            ? (this.isManageTab() ? 'Loaded saved unavailable dates for this team member.' : 'Loaded your saved unavailable dates.')
            : 'No saved dates yet. Check every service you cannot serve.';
        } catch (e) {
          console.error(e);
          this.error = (e && e.message) ? e.message : 'Unable to load availability.';
        } finally {
          this.loadingAvailability = false;
        }
      },

      clearSelections() {
        this.selectedServiceIds = [];
      },

      async saveAvailability() {
        const email = this.currentTargetEmail();
        if (!email) {
          this.error = this.isManageTab() ? 'Team member is required.' : 'Email is required.';
          return;
        }
        if (!this.memberVerified || email !== this.verifiedEmail) {
          this.error = this.isManageTab()
            ? 'Load dates for this team member before saving.'
            : 'Load dates for your email before saving.';
          return;
        }
        this.saving = true;
        this.error = '';
        this.statusMessage = '';
        try {
          await callRpc('saveMemberAvailability', {
            email,
            unavailableServiceIds: this.selectedServiceIds
          });
          this.statusMessage = this.isManageTab()
            ? 'Availability saved for this team member.'
            : 'Availability saved. Thank you!';
          this.prefilledFor = email;
        } catch (e) {
          console.error(e);
          this.error = (e && e.message) ? e.message : 'Unable to save availability.';
        } finally {
          this.saving = false;
        }
      }
    };
  }
</script>
