<script>
  const AUTH_STORAGE_KEY = '__wpAuthToken';
  const GOOGLE_CLIENT_ID = (() => {
    const explicit = String(window.__GOOGLE_CLIENT_ID__ || '').trim();
    if (explicit) return explicit;
    try {
      const meta = document.querySelector('meta[name="google-client-id"]');
      return String(meta?.content || '').trim();
    } catch (_) {
      return '';
    }
  })();
  let googleAuthInitialized = false;
  const DEBUG_FLAG = (() => {
    try {
      const params = new URLSearchParams(window.location.search || '');
      return ['1', 'true', 'yes', 'on'].includes(String(params.get('debugAuth') || '').toLowerCase());
    } catch (_) {
      return false;
    }
  })();

  function getStoredAuthToken() {
    if (typeof window === 'undefined') return '';
    try {
      const stored = window.sessionStorage?.getItem(AUTH_STORAGE_KEY) || '';
      return stored || window.__AUTH_TOKEN__ || '';
    } catch (_) {
      return window.__AUTH_TOKEN__ || '';
    }
  }

  function setStoredAuthToken(token) {
    window.__AUTH_TOKEN__ = token || '';
    if (typeof window === 'undefined') return;
    try {
      if (token) {
        window.sessionStorage?.setItem(AUTH_STORAGE_KEY, token);
      } else {
        window.sessionStorage?.removeItem(AUTH_STORAGE_KEY);
      }
    } catch (_) { /* ignore */ }
  }

  function clearStoredAuthToken() {
    setStoredAuthToken('');
  }

  function renderGoogleSignInButtons() {
    if (!GOOGLE_CLIENT_ID) return;
    if (!(window.google && google.accounts && google.accounts.id)) return;
    document.querySelectorAll('[data-google-signin]').forEach((node) => {
      if (!node || node.dataset.googleRendered === 'true') return;
      node.innerHTML = '';
      google.accounts.id.renderButton(node, {
        theme: 'outline',
        size: 'medium',
        shape: 'pill',
        text: 'signin_with',
        logo_alignment: 'left',
        width: 220
      });
      node.dataset.googleRendered = 'true';
    });
  }

  function initializeGoogleAuth() {
    if (!GOOGLE_CLIENT_ID) return false;
    if (!(window.google && google.accounts && google.accounts.id)) return false;
    if (!googleAuthInitialized) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: async (response) => {
          const credential = String(response && response.credential || '').trim();
          if (!credential) {
            notify('Google sign-in did not return a credential.', 'error', 3200);
            return;
          }
          setStoredAuthToken(credential);
          try {
            const auth = await refreshAuthContext();
            renderGoogleSignInButtons();
            if (auth && auth.isLoggedIn) {
              notify(`Signed in as ${auth.email}`, 'success', 2600);
            } else {
              notify('Signed in, but no matching role was found for this account.', 'error', 3600);
            }
          } catch (err) {
            clearStoredAuthToken();
            notify(err && err.message ? err.message : 'Google sign-in failed.', 'error', 3600);
          }
        },
        auto_select: false,
        cancel_on_tap_outside: true
      });
      googleAuthInitialized = true;
    }
    renderGoogleSignInButtons();
    return true;
  }

  window.signOutGoogleAuth = async function signOutGoogleAuth() {
    clearStoredAuthToken();
    try {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
    } catch (_) { /* ignore */ }
    const auth = setAuthState(DEFAULT_AUTH, { ready: true });
    renderGoogleSignInButtons();
    notify('Signed out.', 'info', 1800);
    return auth;
  };

  function callRpc(method, payload) {
    return new Promise((resolve, reject) => {
      const base = String(window.__BASE__ || '').replace(/\/+$/, '');
      const authToken = getStoredAuthToken();
      const runner = (window.google && google.script && google.script.run) || null;
      const rpcUrl = /\/(exec|dev)$/i.test(base) ? base : `${base}/exec`;

      // When an auth token exists, force the HTTP RPC path so the server can
      // resolve the signed-in user's email from the bearer token.
      if ((!authToken || !base) && runner && runner.rpc) {
        runner
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .rpc({ method, payload });
        return;
      }

      if (!base) {
        reject(new Error('RPC endpoint is not configured. Build the standalone app with APPS_SCRIPT_BASE set to your Worker URL, or set window.APP_RPC_BASE at runtime.'));
        return;
      }

      const headers = Object.assign(
        { 'Content-Type': 'text/plain;charset=utf-8' },
        window.__RPC_HEADERS__ && typeof window.__RPC_HEADERS__ === 'object'
          ? window.__RPC_HEADERS__
          : {}
      );

      fetch(rpcUrl, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        headers,
        body: JSON.stringify({ method, payload, authToken })
      })
        .then(async (res) => {
          let data = null;
          try { data = await res.json(); }
          catch (_) {
            const hint = res && res.status ? ` (${res.status})` : '';
            throw new Error(`Invalid RPC response${hint}. The Worker likely returned HTML instead of JSON.`);
          }

          if (data && typeof data === 'object' && 'ok' in data) {
            if (data.ok) return data.data;
            throw new Error(data.error || 'RPC request failed');
          }
          return data;
        })
        .then(resolve)
        .catch((err) => reject(err));
    });
  }

  const forcedGuestFlag = (() => {
    try {
      const params = new URLSearchParams(window.location.search || '');
      const mode = String(params.get('mode') || params.get('view') || '').toLowerCase();
      return mode === 'guest';
    } catch (_) {
      return false;
    }
  })();

  const isLikelyLocalhost = (() => {
    try {
      const host = String(window.location.hostname || '').toLowerCase();
      if (!host) return false;
      if (host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0') return true;
      if (host.endsWith('.local')) return true;
      if (/^\d+\.\d+\.\d+\.\d+$/.test(host)) {
        if (host.startsWith('10.')) return true;
        if (host.startsWith('192.168.')) return true;
        if (/^172\.(1[6-9]|2\d|3[0-1])\./.test(host)) return true;
      }
      return false;
    } catch (_) {
      return false;
    }
  })();

  // Local dev helper: simulate an editor profile on localhost so tabs stay accessible.
  const devAuthOverride = (() => {
    if (forcedGuestFlag) return null;
    if (!isLikelyLocalhost) return null;
    try {
      const params = new URLSearchParams(window.location.search || '');
      const authParam = String(params.get('auth') || params.get('dev') || '').toLowerCase();
      if (authParam === 'off' || authParam === 'guest') return null;
    } catch (_) { /* ignore */ }
    try {
      const lsFlag = window.localStorage && window.localStorage.getItem && window.localStorage.getItem('wp.devAuthOverride');
      if (String(lsFlag || '').toLowerCase() === 'off') return null;
    } catch (_) { /* ignore */ }
    return {
      email: 'local.dev@worshipplanner.test',
      permissions: 'Administrator',
      first: 'Local',
      last: 'Dev',
      isAdmin: true,
      isLoggedIn: true,
      capabilities: {
        canViewPlan: true,
        canEditPlan: true,
        canEditSongs: true,
        canViewTeam: true,
        canManageTeams: true,
        canAdminAvailability: true
      },
      devOverride: true
    };
  })();

  let devOverrideNoticeShown = false;
  const applyDevAuthOverride = (profile) => {
    if (!devAuthOverride) return profile;
    const email = String(profile && profile.email || '').trim();
    const caps = profile && profile.capabilities;
    const hasCapabilities = !!(caps && (caps.canViewPlan || caps.canEditPlan || caps.canEditSongs || caps.canViewTeam || caps.canManageTeams || caps.canAdminAvailability));
    if (email || hasCapabilities) return profile;
    if (!devOverrideNoticeShown) {
      devOverrideNoticeShown = true;
      try {
        console.info('[auth] Local dev auth override enabled. Append "?mode=guest" or set localStorage["wp.devAuthOverride"]="off" to view as guest.');
      } catch (_) { /* ignore */ }
    }
    return Object.assign({}, devAuthOverride);
  };

  const DEFAULT_CAPABILITIES = {
    canViewPlan: false,
    canEditPlan: false,
    canEditSongs: false,
    canViewTeam: false,
    canManageTeams: false,
    canAdminAvailability: false
  };
  const DEFAULT_AUTH = {
    email: '',
    permissions: '',
    first: '',
    last: '',
    isAdmin: false,
    isLoggedIn: false,
    capabilities: { ...DEFAULT_CAPABILITIES },
    ready: false
  };
  const DEFAULT_AUTH_DEBUG = {
    enabled: DEBUG_FLAG,
    baseUrl: '',
    tokenPresent: false,
    tokenPreview: '',
    googleClientIdPreview: '',
    tokenEmail: '',
    sessionEmail: '',
    resolvedEmail: '',
    permissions: '',
    isLoggedIn: false,
    hasPlanAccess: false,
    hasTeamAccess: false,
    error: '',
    updatedAt: 0
  };

  const dispatchAuthChanged = (auth) => {
    try {
      document.dispatchEvent(new CustomEvent('app-auth-changed', { detail: auth }));
    } catch (_) { /* ignore */ }
  };

  function normalizeAuthState(profile, ready = false) {
    const raw = profile && typeof profile === 'object' ? profile : {};
    const capabilities = Object.assign({}, DEFAULT_CAPABILITIES, raw.capabilities || {});
    const normalized = Object.assign({}, DEFAULT_AUTH, raw, {
      capabilities,
      ready: ready || Boolean(raw.ready)
    });
    if (typeof normalized.isLoggedIn !== 'boolean') {
      normalized.isLoggedIn = Boolean(normalized.email);
    }
    if (typeof normalized.isAdmin !== 'boolean') {
      normalized.isAdmin = Boolean(capabilities.canManageTeams);
    }
    return normalized;
  }

  function setAuthState(profile, { ready = false } = {}) {
    const effectiveProfile = applyDevAuthOverride(profile);
    const normalized = normalizeAuthState(effectiveProfile, ready || Boolean(effectiveProfile && effectiveProfile.devOverride));
    window.__AUTH__ = normalized;
    window.__GUEST__ = Boolean(window.__FORCE_GUEST__ || forcedGuestFlag || !normalized.capabilities.canEditPlan);
    dispatchAuthChanged(normalized);
    setTimeout(() => renderGoogleSignInButtons(), 0);
    return normalized;
  }

  async function refreshAuthContext() {
    try {
      const profile = await callRpc('getViewerProfile', null);
      refreshAuthDebug();
      return setAuthState(profile, { ready: true });
    } catch (err) {
      console.warn('Auth check failed', err);
      refreshAuthDebug(err);
      const fallbackReady = Boolean(devAuthOverride);
      return setAuthState(window.__AUTH__ || DEFAULT_AUTH, { ready: fallbackReady });
    }
  }

  async function refreshAuthDebug(err) {
    const token = getStoredAuthToken();
    const baseUrl = String(window.__BASE__ || '').trim();
    const googleClientId = String(GOOGLE_CLIENT_ID || '').trim();
    const seed = {
      ...DEFAULT_AUTH_DEBUG,
      enabled: DEBUG_FLAG,
      baseUrl,
      tokenPresent: Boolean(token),
      tokenPreview: token ? `${token.slice(0, 18)}...` : '',
      googleClientIdPreview: googleClientId ? `${googleClientId.slice(0, 24)}...` : '',
      error: err && err.message ? err.message : '',
      updatedAt: Date.now()
    };
    if (!DEBUG_FLAG) {
      window.__AUTH_DEBUG__ = seed;
      try {
        document.dispatchEvent(new CustomEvent('app-auth-debug-changed', { detail: seed }));
      } catch (_) { /* ignore */ }
      return seed;
    }
    try {
      const data = await callRpc('getViewerAuthDebug', null);
      const next = Object.assign({}, seed, data || {}, { updatedAt: Date.now() });
      window.__AUTH_DEBUG__ = next;
      try {
        document.dispatchEvent(new CustomEvent('app-auth-debug-changed', { detail: next }));
      } catch (_) { /* ignore */ }
      return next;
    } catch (debugErr) {
      const fallback = Object.assign({}, seed, {
        error: debugErr && debugErr.message ? debugErr.message : seed.error
      });
      window.__AUTH_DEBUG__ = fallback;
      try {
        document.dispatchEvent(new CustomEvent('app-auth-debug-changed', { detail: fallback }));
      } catch (_) { /* ignore */ }
      return fallback;
    }
  }

  window.__FORCE_GUEST__ = forcedGuestFlag;
  const initialProfile = applyDevAuthOverride(typeof window.__VIEWER__ === 'object' ? window.__VIEWER__ : null);
  const initialReady = Boolean(window.__VIEWER__) || Boolean(initialProfile && initialProfile.devOverride);
  window.__AUTH__ = normalizeAuthState(initialProfile, initialReady);
  window.__GUEST__ = Boolean(window.__FORCE_GUEST__ || !window.__AUTH__.capabilities.canEditPlan);
  dispatchAuthChanged(window.__AUTH__);
  window.__AUTH_DEBUG__ = { ...DEFAULT_AUTH_DEBUG, enabled: DEBUG_FLAG };
  refreshAuthContext();
  window.refreshAuthContext = refreshAuthContext;
  window.refreshAuthDebug = refreshAuthDebug;
  window.addEventListener('load', () => {
    initializeGoogleAuth();
    renderGoogleSignInButtons();
    refreshAuthDebug();
  });

  // Minimal toast-style notifier for consistent UX (client-only)
  function notify(message, type = 'info', ms = 2200) {
    try {
      const root = document.createElement('div');
      root.textContent = String(message ?? '');
      root.style.position = 'fixed';
      root.style.right = '12px';
      root.style.bottom = '12px';
      root.style.zIndex = '9999';
      root.style.maxWidth = '70vw';
      root.style.padding = '8px 12px';
      root.style.borderRadius = '6px';
      root.style.color = '#111827';
      root.style.background = type === 'error' ? '#fecaca' : type === 'success' ? '#bbf7d0' : '#e5e7eb';
      root.style.boxShadow = '0 4px 14px rgba(0,0,0,0.2)';
      document.body.appendChild(root);
      setTimeout(() => root.remove(), ms);
    } catch (_) {
      try { alert(String(message ?? '')); } catch(_) {}
    }
  }

  // Shared media-label formatter so song views interpret Drive filenames consistently.
  (function (global) {
    if (global && global.mediaLabelHelper) return;

    const MEDIA_AUDIO_EXTS = new Set(['mp3', 'm4a', 'wav', 'aac', 'flac', 'ogg', 'wma', 'aiff', 'mid', 'midi']);
    const MEDIA_DOC_RULES = [
      { label: 'Guitar', patterns: [/gdoc\b/i, /\bguitar\b/i, /(^|[\s_-])g($|[\s_-])/i] },
      { label: 'Lyrics', patterns: [/wdoc\b/i, /\blyrics?\b/i, /(^|[\s_-])w($|[\s_-])/i] },
      { label: 'Bass', patterns: [/bdoc\b/i, /\bbass\b/i, /(^|[\s_-])b($|[\s_-])/i] }
    ];
    const MEDIA_MONTHS = {
      jan: 'Jan', feb: 'Feb', mar: 'Mar', apr: 'Apr', may: 'May', jun: 'Jun',
      jul: 'Jul', aug: 'Aug', sep: 'Sep', oct: 'Oct', nov: 'Nov', dec: 'Dec'
    };

    function escapeRegex(value) {
      return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function normalizeMediaSymbols(str) {
      return String(str || '')
        .replace(/[â€™â€˜]/g, "'")
        .replace(/[â€œâ€]/g, '"')
        .replace(/[â€â€‘â€“â€”]/g, '-');
    }

    function removeExtension(name) {
      return String(name || '').replace(/\.[^.]+$/, '').trim();
    }

    function trimDelimiters(str) {
      return String(str || '')
        .replace(/^[\s._\-+/]+/, '')
        .replace(/[\s._\-+/]+$/, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function normalizeResidual(str) {
      let out = normalizeMediaSymbols(str);
      out = out.replace(/[_]+/g, ' ');
      out = out.replace(/[\/]+/g, ' ');
      out = out.replace(/\(\s*\)/g, ' ');
      out = out.replace(/\[\s*\]/g, ' ');
      out = out.replace(/\{\s*\}/g, ' ');
      out = out.replace(/\s{2,}/g, ' ');
      return trimDelimiters(out);
    }

    function stripLanguageMarkers(str) {
      let out = normalizeMediaSymbols(str);
      out = out.replace(/\(\s*\+?\s*(spanish|espanol|español|sp)\s*\)/ig, ' ');
      out = out.replace(/(^|[\s._\-+])\+?(spanish|espanol|español|sp)\b/ig, '$1');
      return normalizeResidual(out);
    }

    function stripSongTitle(name, songTitle) {
      const base = normalizeMediaSymbols(name);
      const song = normalizeMediaSymbols(String(songTitle || '').trim());
      if (!song) return normalizeResidual(base);
      const candidates = Array.from(new Set([
        normalizeResidual(song),
        stripLanguageMarkers(song)
      ].filter(Boolean))).sort((a, b) => b.length - a.length);
      let working = base;
      for (const candidate of candidates) {
        const escaped = escapeRegex(candidate);
        const pattern = new RegExp(escaped, 'ig');
        working = working.replace(pattern, ' ');
      }
      return normalizeResidual(working);
    }

    function isAudioFile(file) {
      const mime = String(file?.mimeType || '').toLowerCase();
      if (mime.startsWith('audio/')) return true;
      const ext = (String(file?.name || '').split('.').pop() || '').toLowerCase();
      return MEDIA_AUDIO_EXTS.has(ext);
    }

    function isVideoFile(file) {
      return String(file?.mimeType || '').toLowerCase().startsWith('video/');
    }

    function detectDocLabel(input) {
      let working = String(input || '');
      let label = '';
      for (const rule of MEDIA_DOC_RULES) {
        for (const rx of rule.patterns) {
          if (rx.test(working)) {
            label = rule.label;
            working = working.replace(rx, ' ');
            return { label, working: normalizeResidual(working) };
          }
        }
      }
      return { label: '', working: normalizeResidual(working) };
    }

    function extractSpanish(input) {
      const raw = String(input || '');
      const parenRx = /\(\s*\+?\s*(spanish|espanol|español|sp)\s*\)/ig;
      const tokenRx = /(^|[\s._\-+])\+?(spanish|espanol|español|sp)\b/ig;
      const found = parenRx.test(raw) || tokenRx.test(raw);
      parenRx.lastIndex = 0;
      tokenRx.lastIndex = 0;
      return {
        hasSpanish: found,
        working: normalizeResidual(raw.replace(parenRx, ' ').replace(tokenRx, '$1'))
      };
    }

    function normalizeCompactDate(token) {
      const match = /^(\d{1,2})([A-Za-z]{3,9})(\d{2,4})$/.exec(String(token || '').trim());
      if (!match) return '';
      const day = Number(match[1]);
      const month = MEDIA_MONTHS[String(match[2] || '').slice(0, 3).toLowerCase()];
      let year = Number(match[3]);
      if (!month || !Number.isFinite(day) || day < 1 || day > 31 || !Number.isFinite(year)) return '';
      if (match[3].length === 2) year += year >= 70 ? 1900 : 2000;
      return `${month} ${day}, ${year}`;
    }

    function normalizeIsoDate(token) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(token || '').trim());
      if (!match) return '';
      const year = Number(match[1]);
      const monthIndex = Number(match[2]) - 1;
      const day = Number(match[3]);
      const month = Object.values(MEDIA_MONTHS)[monthIndex];
      if (!month || !Number.isFinite(year) || !Number.isFinite(day)) return '';
      return `${month} ${day}, ${year}`;
    }

    function extractDateLabel(input) {
      const patterns = [
        /\b\d{4}-\d{2}-\d{2}\b/,
        /\b\d{1,2}[A-Za-z]{3,9}\d{2,4}\b/,
        /\b[A-Za-z]{3,9}\s?\d{2,4}\b/
      ];
      let working = String(input || '');
      for (const pattern of patterns) {
        const match = working.match(pattern);
        if (!match) continue;
        const raw = String(match[0] || '').trim();
        let label = normalizeIsoDate(raw) || normalizeCompactDate(raw);
        if (!label) {
          const parsed = Date.parse(raw);
          if (!Number.isNaN(parsed)) {
            const date = new Date(parsed);
            label = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
          } else {
            label = raw;
          }
        }
        working = normalizeResidual(working.replace(raw, ' '));
        return { label, working };
      }
      return { label: '', working: normalizeResidual(working) };
    }

    function format(file, songTitle) {
      const raw = String(file?.name || '').trim();
      if (!raw) return 'File';

      const base = removeExtension(normalizeMediaSymbols(raw));
      let working = stripSongTitle(base, songTitle);

      const doc = detectDocLabel(working);
      working = doc.working;

      const spanish = extractSpanish(working);
      working = spanish.working;

      const date = extractDateLabel(working);
      working = date.working;

      const qualifiers = [];
      if (spanish.hasSpanish) qualifiers.push('Spanish');
      if (date.label) qualifiers.push(date.label);
      if (working) qualifiers.push(working);

      if (doc.label) return qualifiers.length ? `${doc.label} (${qualifiers.join(', ')})` : doc.label;
      if (qualifiers.length) return qualifiers.join(' - ');
      if (isAudioFile(file)) return 'Audio';
      if (isVideoFile(file)) return 'Video';
      return base || raw;
    }

    global.mediaLabelHelper = {
      format,
      isAudioFile
    };
  })(window);

  (function (global) {
    if (global && typeof global.songPreview === 'function') return;
    function normalizePreview(data) {
      if (!data || !data.hasSong) return { hasSong: false };
      return {
        hasSong: true,
        songName: data.song?.Song || data.songName || '(Untitled)',
        reason: data.song?.Reason || data.reason || '',
        leader: data.song?.Leader || data.leader || '',
        season: data.song?.Season || data.season || '',
        themes: data.song?.Themes || data.themes || '',
        scriptures: data.song?.Scriptures || data.scriptures || '',
        keywords: data.song?.Keywords || data.keywords || '',
        lyrics: data.song?.Lyrics || data.song?.['Lyrics (PD)'] || data.lyrics || '',
        aiReason: data.aiReason || '',
        additional: data.additional || '',
        showUse: !!data.isModalContext,
        onUse: typeof data.useSong === 'function' ? () => data.useSong() : null,
        onCopy: typeof data.onCopy === 'function'
          ? (evt) => data.onCopy(evt)
          : (typeof data.copyLyrics === 'function' ? (evt) => data.copyLyrics(evt) : null),
        link: data.song?.Link || data.link || '',
        showMedia: !!data.mediaFiles,
        mediaFiles: Array.isArray(data.mediaFiles) ? data.mediaFiles : [],
        mediaLoading: !!data.mediaLoading,
        mediaMessage: data.mediaMessage || 'No files in folder.',
        stats: {
          uses: data.stats?.uses || data.song?.Uses || '',
          usage: data.stats?.usage || data.song?.Usage || '',
          years: data.stats?.years || data.song?.Years_Used || '',
          lastUsed: data.stats?.lastUsed || data.song?.Last_Used || '',
          firstUsed: data.stats?.firstUsed || data.song?.First_Used || ''
        },
        folderUrl: data.song?._folderUrl || '',
        onOpenFolder: typeof data.openFolder === 'function' ? () => data.openFolder(data.song?._folderUrl) : null,
        starred: !!data.starred,
        onToggleStar: typeof data.onToggleStar === 'function' ? (evt) => data.onToggleStar(evt) : null
      };
    }
    global.songPreview = function songPreview(initial = {}) {
      return {
        preview: normalizePreview(initial),
        update(data) {
          this.preview = normalizePreview(data);
        }
      };
    };
  })(typeof window !== 'undefined' ? window : this);
</script>
