<div x-data="scheduleApp()" x-init="init()" class="h-full flex flex-col">
  <div class="flex-1 min-h-0 overflow-auto px-4 pb-4 pt-4 space-y-6">
    <div class="text-muted" x-show="loading">Loading upcoming services...</div>
    <div class="text-red-600" x-show="error" x-text="error"></div>
    <div class="text-muted" x-show="!loading && !scheduleLayouts.length && !error">
      No upcoming services to schedule.
    </div>

    <template x-for="layout in scheduleLayouts" :key="layout.teamType">
      <section class="border border-slate-200 rounded bg-white relative" x-show="!loading && scheduleLayouts.length">
        <div class="overflow-x-auto pb-4">
          <table class="app-table">
            <thead class="text-gray-700">
              <tr class="bg-blue-900 text-white sticky top-0 z-20">
                <th class="text-left px-2 py-3 min-w-[104px] sticky left-0 z-30 bg-blue-900 align-top">
                  <div class="flex flex-col">
                    <h3 class="text-xl font-semibold text-white normal-case" x-text="layout.teamType || '(unspecified team)'"></h3>
                    <span class="text-xs text-blue-200 normal-case" x-text="layout.columns.length + ' services'"></span>
                  </div>
                </th>
                <template x-for="column in layout.columns" :key="'blue-' + column.id">
                  <th class="text-left font-medium px-2 py-3 align-top min-w-[110px] bg-blue-900 text-white">
                    <div class="font-semibold text-white normal-case text-[11px] leading-tight" x-text="column.service.label"></div>
                    <div class="text-[11px] text-blue-100 normal-case leading-tight" x-text="column.service.ordinalLabel"></div>
                    <div class="text-[11px] text-blue-200 normal-case leading-tight"
                      x-show="column.teamLabel && column.teamLabel !== column.service.ordinalLabel && column.teamLabel !== column.service.label"
                      x-text="column.teamLabel"></div>
                  </th>
                </template>
              </tr>
              <tr class="bg-slate-100 sticky top-[72px] z-20">
                <th class="text-left font-medium px-2 py-2 min-w-[104px] sticky left-0 z-30 bg-slate-100">Role</th>
                <template x-for="column in layout.columns" :key="'gray-' + column.id">
                  <th class="text-left font-medium px-2 py-2 align-top min-w-[110px] bg-slate-100">
                    <div class="mt-1 text-[11px] text-rose-700 normal-case leading-tight"
                      x-show="unavailableMembersForService(column.id).length"
                      x-text="unavailableSummaryForService(column.id)"></div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in layout.rows" :key="row.key">
                <tr class="border-t">
                  <th class="text-left bg-slate-50 align-middle sticky left-0 z-10" x-text="row.label"></th>
                  <template x-for="column in layout.columns" :key="column.id + '-' + row.key">
                    <td class="align-top min-w-[110px]"
                      :class="layout.duplicateFlags?.[scheduleCellKey(column.id, layout.teamType, row.label)] ? 'bg-pink-100' : (!row.cells[column.id]?.memberEmail ? 'bg-amber-50' : '')">
                      <div class="w-full px-3 py-2 text-sm space-y-2"
                        :class="layout.duplicateFlags?.[scheduleCellKey(column.id, layout.teamType, row.label)] ? 'bg-pink-100 text-gray-900' : (!row.cells[column.id]?.memberEmail ? 'bg-amber-50 text-gray-500' : 'text-gray-900')">
                        <div>
                          <span x-text="row.cells[column.id]?.memberName || 'Open'"></span>
                        </div>
                        <div class="flex flex-col items-start gap-1" x-show="!row.cells[column.id]?.memberEmail">
                          <button
                            type="button"
                            class="btn btn--accent-soft btn--xs"
                            x-show="canCurrentViewerVolunteer(row.cells[column.id], layout.teamType, row.label)"
                            :disabled="volunteerBusy?.[scheduleCellKey(column.id, layout.teamType, row.label)]"
                            @click="toggleVolunteerRequest(column.id, layout.teamType, row.label)"
                            x-text="volunteerButtonLabel(column.id, layout.teamType, row.label)"></button>
                          <div class="text-[11px] text-emerald-700"
                            x-show="volunteerCountLabel(column.id, layout.teamType, row.label)"
                            x-text="volunteerCountLabel(column.id, layout.teamType, row.label)"></div>
                        </div>
                      </div>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </template>
  </div>
</div>
