<div x-data="availabilityApp()" x-init="init()" class="h-full min-h-0 bg-gray-50 overflow-hidden flex flex-col">
  <div class="max-w-3xl w-full mx-auto p-6 pb-6 flex-1 min-h-0 flex flex-col">
    <div class="bg-white rounded-lg shadow border border-gray-300 p-5 flex-1 min-h-0 flex flex-col overflow-hidden">
      <h1 class="text-2xl font-semibold mb-1" x-text="availabilityCardTitle()"></h1>
      <p class="text-sm text-gray-600 mb-5">
        <span x-text="availabilityCardIntro()"></span>
      </p>

      <label class="block text-sm text-gray-700 mb-3">
        <span x-text="availabilityFieldLabel()"></span>
        <div class="mt-1 flex gap-2">
          <input x-cloak x-show="!isManageTab() && !viewerLoggedIn()" type="email" placeholder="you@example.com"
            class="flex-1 form-control"
            x-model="email"
            @input="onEmailInput()"
            @blur="prefillAvailability()"
            autocomplete="email" required>
          <div x-cloak x-show="!isManageTab() && viewerLoggedIn()" class="flex-1 form-control bg-gray-50 text-gray-700 flex items-center">
            <span x-text="viewerEmail()"></span>
          </div>
          <select x-cloak x-show="isManageTab()"
            class="flex-1 form-control"
            x-model="managedEmail"
            @change="onManagedEmailChange()"
            :disabled="adminEmailSelectDisabled()">
            <option value="">Select a user</option>
            <template x-for="member in adminMemberOptions()" :key="member.email">
              <option :value="member.email" x-text="member.label"></option>
            </template>
          </select>
          <button type="button" class="btn btn--surface btn--lg"
            @click="prefillAvailability(true)" :disabled="loadingAvailability || !emailValid()">
            <span x-show="!loadingAvailability" x-text="isManageTab() ? 'Load Dates' : (viewerLoggedIn() ? 'Reload Dates' : 'Load Dates')"></span>
            <span x-show="loadingAvailability">Loading...</span>
          </button>
        </div>
      </label>

      <div class="mb-4 text-error" x-show="error" x-text="error"></div>
      <div class="mb-4 text-sm text-emerald-700" x-show="statusMessage" x-text="statusMessage"></div>
      <div class="mb-4 text-sm text-gray-600" x-show="!memberVerified">
        <span x-text="availabilityHelperText()"></span>
      </div>

      <div x-show="loadingServices" class="text-sm text-gray-600">Loading upcoming services&hellip;</div>
      <div x-show="!loadingServices && !services.length" class="text-sm text-gray-600">No upcoming services yet.</div>

      <form x-show="memberVerified && !loadingServices && services.length" @submit.prevent="saveAvailability()" class="flex flex-col gap-4 min-h-0 flex-1">
        <div class="flex justify-between gap-4">
          <p class="text-muted">Checked services mark the Sundays you are unavailable.</p>
          <div class="flex justify-end items-center">
            <button type="submit"
              class="btn btn--accent btn--lg"
              :disabled="saving || !emailValid() || !memberVerified">
              <span x-show="!saving">Save Availability</span>
              <span x-show="saving">Saving...</span>
            </button>
          </div>
        </div>
        <div class="border rounded divide-y flex-1 min-h-0 overflow-y-auto">
          <template x-for="svc in services" :key="svc.id || svc.date">
            <label class="flex items-start gap-3 px-3 py-3 hover:bg-blue-50">
              <input type="checkbox" class="mt-1 rounded border-gray-300" :value="svc.id"
                x-model="selectedServiceIds">
              <div>
                <div class="font-semibold" x-text="svc.label"></div>
              </div>
            </label>
          </template>
        </div>
        <button type="button" class="self-start btn btn--link"
          @click="clearSelections()" :disabled="saving">Clear all</button>
      </form>
    </div>
  </div>
</div>
