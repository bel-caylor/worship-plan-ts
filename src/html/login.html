<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <style>
    body { font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; padding:1rem; background:#f3f4f6; }
    .panel { background:white; border-radius:8px; padding:1.5rem; box-shadow:0 20px 50px rgba(15,23,42,.15); }
    .status { margin-top:1rem; font-size:.9rem; color:#111827; }
  </style>
</head>
<body>
  <div class="panel">
    <h1 style="margin:0 0 .5rem;">Authenticating…</h1>
    <p class="status" id="status">Please wait while we sign you in with Google.</p>
  </div>
  <script>
    const serverToken = `<?!= JSON.stringify(typeof authToken !== 'undefined' ? authToken : '') ?>`;
    const statusEl = document.getElementById('status');
    const setStatus = (message) => {
      if (statusEl) statusEl.textContent = message;
    };
    const sendToken = (token) => {
      setStatus('Signed in. Returning to the app...');
      if (window.opener && token) {
        window.opener.postMessage({ type: 'auth-token', token }, '*');
      }
      try { window.close(); } catch (_){}
    };
    const reportError = (err) => {
      const message = err && err.message ? err.message : String(err || 'Login failed.');
      setStatus(`Login failed: ${message}`);
      console.error(err);
    };
    const start = () => {
      let token = '';
      try {
        token = JSON.parse(serverToken);
      } catch (_) {
        token = '';
      }
      if (!token) {
        reportError(new Error('Google sign-in required. Make sure you opened the deployed web app while signed into Google.'));
        return;
      }
      setStatus('Signed in. Returning to the app...');
      sendToken(token);
    };
    window.addEventListener('load', start);
    setTimeout(() => {
      if (statusEl && /Please wait|loading/i.test(statusEl.textContent || '')) {
        setStatus('Still working... if this stays open, close it and click Login again.');
      }
    }, 5000);
  </script>
</body>
</html>
